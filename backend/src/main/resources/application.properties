spring.application.name=backend

# Variabili locali da .env (formato KEY=valore, escluso da git)
# Il secondo percorso serve quando IntelliJ avvia l'app dalla cartella del progetto invece che da backend/
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poketeca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT firmato HS256: il secret deve essere di almeno 32 byte
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.data.web.pageable.max-page-size=100

# API esterna di carte Pokémon (gratuita, senza chiave)
app.tcgdex.base-url=https://api.tcgdex.net/v2

# Cloudinary per le foto delle carte: senza chiavi l'upload risponde 503, il resto funziona
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Limite del file caricato (il controllo preciso su tipo e dimensione lo fa ImageService)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=${PORT:8080}

# Account dimostrativo: in locale spento, online acceso dal profilo prod
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.email=${DEMO_EMAIL:demo@poketeca.it}
app.demo.password=${DEMO_PASSWORD:demo1234}
