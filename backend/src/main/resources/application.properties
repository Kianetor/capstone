spring.application.name=backend

# Variabili locali da .env (formato KEY=valore, escluso da git)
# Il secondo percorso serve quando IntelliJ avvia l'app dalla cartella del progetto invece che da backend/
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardvault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT firmato HS256: il secret deve essere di almeno 32 byte
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.data.web.pageable.max-page-size=100

# API esterna di carte Pokémon (gratuita, senza chiave)
app.tcgdex.base-url=https://api.tcgdex.net/v2

server.port=${PORT:8080}
