# Profilo della versione online (Render): si attiva con SPRING_PROFILES_ACTIVE=prod
# Render fornisce i dati del database separati, qui li uniamo nell'indirizzo JDBC
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Il piano gratuito ha poche connessioni e poca memoria: pool piccolo
spring.datasource.hikari.maximum-pool-size=5

# Dietro il proxy di Render: rispettiamo le intestazioni X-Forwarded-*
server.forward-headers-strategy=framework

# Account dimostrativo con carte e transazioni, creato all'avvio se non esiste (vedi DemoDataInitializer)
app.demo.enabled=${DEMO_ENABLED:true}

logging.level.root=WARN
logging.level.kian.backend=INFO
