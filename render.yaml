# Blueprint di Render: database, backend e frontend in un colpo solo (New > Blueprint > questo repository).
# Le variabili con sync: false non sono nel repository: Render le chiede nel form del Blueprint.

databases:
  - name: poketeca-db
    plan: free
    databaseName: poketeca
    user: poketeca

services:
  # Backend Spring Boot, costruito con backend/Dockerfile
  - type: web
    name: poketeca-be
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: poketeca-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: poketeca-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: poketeca-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: poketeca-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: poketeca-db
          property: password
      # Chiave di firma dei JWT: la genera Render, nessuno deve inventarla
      - key: JWT_SECRET
        generateValue: true
      # Indirizzo del frontend, es. https://poketeca-fe.onrender.com (senza / finale)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Upload delle foto: senza queste chiavi il resto dell'app funziona lo stesso
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend React: sito statico costruito da Vite
  - type: web
    name: poketeca-fe
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Indirizzo del backend, es. https://poketeca-be.onrender.com (senza / finale). Letto durante la build
      - key: VITE_API_URL
        sync: false
    routes:
      # Applicazione a pagina singola: ogni indirizzo (es. /cards/123) apre index.html e decide React Router
      - type: rewrite
        source: /*
        destination: /index.html
